# Боевой конфиг nginx. Два блока server: для http (порт 80) и https (443).
# DOMAIN подставляется через envsubst из переменной окружения перед запуском nginx.

# HTTP-сервер: отвечает за проверку домена для Let's Encrypt, всё остальное редиректит на https
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # путь, по которому certbot кладёт файлы для проверки владения доменом
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # любые другие запросы — редирект на https той же ссылки
    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS-сервер: раздаёт фронт и проксирует /api/ на бекенд
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # сертификаты от Let's Encrypt (живут в общем томе с certbot)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # статика собранного React-приложения лежит здесь
    root /usr/share/nginx/html;
    index index.html;

    # сжатие текстовых ответов — фронт грузится заметно быстрее
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ограничение размера тела запроса — защита от мусорных payload-ов
    client_max_body_size 256k;

    # запросы к бекенду — проксируем на контейнер backend по внутренней сети docker
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # всё остальное — статика. try_files отдаёт index.html для несуществующих путей,
    # чтобы работали роуты React Router типа /tasks/equilibrium_v1
    location / {
        try_files $uri $uri/ /index.html;
    }
}
