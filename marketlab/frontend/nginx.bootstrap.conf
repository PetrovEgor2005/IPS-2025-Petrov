# Временный конфиг для самого первого запуска, когда сертификата ещё нет
# Сервер слушает 80 порт, отдаёт только файлы для acme-проверки от Let's Encrypt
# Когда certbot выпишет сертификат, надо переключиться на nginx.prod.conf и перезапустить nginx

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 200 'MarketLab — bootstrap. Awaiting certificate.\n';
        add_header Content-Type text/plain;
    }
}
