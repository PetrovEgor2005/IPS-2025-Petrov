exclude: |
  (?x)^(
    \.idea/.*|
    marketlab/frontend/tsconfig\.tsbuildinfo
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        files: ^marketlab/
      - id: trailing-whitespace
        files: ^marketlab/
      - id: check-yaml
        files: ^marketlab/
      - id: check-toml
        files: ^marketlab/
      - id: check-merge-conflict
        files: ^marketlab/
